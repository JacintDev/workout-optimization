<nav>
  <!-- FELSŐ SÁV (logo + hamburger) -->
  <div class="nav-inner">
    <div class="logo">
      <div class="logo-container">
        <div class="workout">Workout</div>
        <div class="optimization">Optimization</div>
      </div>
    </div>

    <!-- HAMBURGER -->
    <button
      class="hamburger"
      type="button"
      aria-label="Menü"
      (click)="toggleMenu()"
    >
      <mat-icon [fontIcon]="isMenuOpen ? 'close' : 'menu'"></mat-icon>
    </button>
  </div>

  <!-- LENYÍLÓ MENÜ -->
  <ul [class.open]="isMenuOpen">
    <li (click)="scrollTo('welcome'); toggleMenu()">
      <mat-icon fontIcon="home"></mat-icon>
      KEZDŐLAP
    </li>

    <li (click)="scrollTo('application'); toggleMenu()">
      <mat-icon fontIcon="apps"></mat-icon>
      ALKALMAZÁS
    </li>

    <li (click)="scrollTo('working'); toggleMenu()">
      <mat-icon fontIcon="layers"></mat-icon>
      MŰKÖDÉS
    </li>

    <li (click)="scrollTo('contact'); toggleMenu()">
      <mat-icon fontIcon="perm_contact_calendar"></mat-icon>
      ELÉRHETŐSÉG
    </li>

    <li
      class="join"
      routerLink="/register"
      *ngIf="!isLoggedIn"
      (click)="toggleMenu()"
    >
      CSATLAKOZZ
      <mat-icon fontIcon="arrow_right_alt"></mat-icon>
    </li>

    <li
      class="join"
      routerLink="/logout"
      *ngIf="isLoggedIn"
      (click)="toggleMenu()"
    >
      KILÉPÉS
      <mat-icon fontIcon="arrow_right_alt"></mat-icon>
    </li>
  </ul>
</nav>
