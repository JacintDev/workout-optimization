<div class="training-container">
  <h2 class="table-title">🏋️‍♂️ Edzés statisztika</h2>
  <div class="table-container">
    <table mat-table [dataSource]="(workoutSessions$ | async) || []">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Dátum</th>
        <td mat-cell *matCellDef="let element">{{ element.date }}</td>
      </ng-container>

      <ng-container matColumnDef="count">
        <th mat-header-cell *matHeaderCellDef>Gyakorlatok száma</th>
        <td mat-cell *matCellDef="let element">{{ element.count }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['date', 'count']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['date', 'count']"></tr>
    </table>
  </div>
  <div class="new-training-container">
    <button mat-button [routerLink]="['/createtraining']">Új edzés</button>
    <span class="label">Helyes? </span>
    <input type="checkbox" [(ngModel)]="training.isCorrect" />
    <button mat-button (click)="stopTraining()" *ngIf="isActiveTraining">
      Megállítás
    </button>
  </div>
</div>
